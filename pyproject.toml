[project]
name = "coverage-badge-action"
version = "1.0.0"
description = "Generates a flat SVG coverage badge from a coverage.py data file - no external services, no API tokens"
requires-python = ">=3.9"
dependencies = [
    "coverage>=7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
