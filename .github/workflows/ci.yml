name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"

      - run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Generate coverage data for the integration check below
        run: uv run coverage run --data-file=.coverage -m pytest -q

      - name: Integration check - run the action against its own coverage data
        uses: ./
        with:
          data-file: .coverage
          output-path: coverage.svg

      - name: Verify the badge was written
        run: test -s coverage.svg && head -c 200 coverage.svg

  node:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test with lcov coverage
        run: >
          node --test --experimental-test-coverage
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=lcov.info
          node/*.test.js

      - name: Integration check - run the Node action against its own lcov data
        uses: ./node
        with:
          lcov-file: lcov.info
          output-path: coverage.svg

      - name: Verify the badge was written
        run: test -s coverage.svg && head -c 200 coverage.svg
