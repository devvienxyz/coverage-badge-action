name: "Static Coverage Badge (Node)"
description: "Generates flat SVG coverage (and optional test count) badges from lcov and test output - no external services."
author: "devvienxyz"
branding:
  icon: "percent"
  color: "green"

inputs:
  lcov-file:
    description: "Path to the lcov file produced by your test runner (node --test, c8, nyc, jest, vitest)."
    required: false
    default: "lcov.info"
  output-path:
    description: "Where to write the generated SVG badge."
    required: false
    default: "coverage.svg"
  test-output:
    description: "Optional saved test-runner output with a `tests N` summary (spec or TAP). When set, a tests badge is also written."
    required: false
    default: ""
  tests-output-path:
    description: "Where to write the tests badge when test-output is set."
    required: false
    default: "tests.svg"

runs:
  using: "composite"
  steps:
    - name: Generate badge
      shell: bash
      run: |
        node "${{ github.action_path }}/generate-badge.js" \
          --lcov-file "${{ inputs.lcov-file }}" \
          --output "${{ inputs.output-path }}" \
          --test-output "${{ inputs.test-output }}" \
          --tests-output "${{ inputs.tests-output-path }}"
